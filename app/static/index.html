<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Entry Column -->
        <div class="entry-panel">
            <div class="brand-header">
                <img src="/static/logo.png" alt="POS Logo" class="brand-logo">
                <h1>PiPOS</h1>
            </div>
            <h2>Add Item</h2>
            <div class="form-group">
                <label for="itemName">Product Name</label>
                <input type="text" id="itemName" placeholder="e.g. Coffee">
            </div>
            <div class="form-group">
                <label for="itemPrice">Price ($)</label>
                <input type="number" id="itemPrice" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="form-group quantity-group">
                <label>Quantity</label>
                <div class="qty-controls">
                    <button type="button" id="btnMinus" class="qty-btn">-</button>
                    <input type="number" id="itemQty" value="1" min="1">
                    <button type="button" id="btnPlus" class="qty-btn">+</button>
                </div>
            </div>
            <button id="btnAdd" class="action-btn primary-btn">Add to Cart</button>
        </div>

        <!-- Cart Column -->
        <div class="cart-panel">
            <h2>Current Order</h2>
            <div class="cart-items" id="cartItems">
                <!-- Items will be injected here -->
            </div>
            
            <div class="cart-summary">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <div class="cart-actions">
                    <button id="btnClear" class="action-btn danger-btn">Clear</button>
                    <button id="btnCheckout" class="action-btn success-btn">Checkout & Print</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
